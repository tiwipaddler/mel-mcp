name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # The tests use a stand-in for the search model, so PyTorch and sentence-transformers
        # (several GB) are left out. Everything else is installed at the pinned versions.
        run: |
          grep -v -E '^(torch|sentence-transformers|transformers)==' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q
